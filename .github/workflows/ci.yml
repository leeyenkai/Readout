name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The runner image decides which Xcodes it ships, and the path is not stable
      # between images, so the newest one installed is selected rather than hard-coded.
      #
      # Readout is developed on Xcode 27 but only needs the iOS 26 SDK: the deployment
      # target is iOS 26.0 and Liquid Glass is an iOS 26 API. GitHub's macos-26 image
      # currently tops out at Xcode 26.6, so the floor here is 26 — if a later change
      # starts needing the iOS 27 SDK, this is where it will say so.
      - name: Select the newest Xcode
        run: |
          set -euo pipefail
          echo "Installed:"
          ls -d /Applications/Xcode*.app
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -switch "$latest"
          major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$major" -lt 26 ]; then
            echo "::error::Readout needs Xcode 26 or later; this runner's newest is $major."
            exit 1
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      # Named so the destination below is stable whatever the runner image ships with.
      - name: Create the simulator
        run: |
          set -euo pipefail
          read -r runtime device < <(xcrun simctl list runtimes --json | scripts/pick-simulator.py)
          echo "Using $device on $runtime"
          xcrun simctl create "Readout CI iPhone" "$device" "$runtime"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -project Readout.xcodeproj \
            -scheme Readout \
            -destination 'platform=iOS Simulator,name=Readout CI iPhone' \
            -resultBundlePath TestResults.xcresult \
            test

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
