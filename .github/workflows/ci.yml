name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        run: sudo xcode-select -switch /Applications/Xcode_27.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Named so the destination below is stable whatever the runner image ships with.
      - name: Create the simulator
        run: |
          runtime=$(xcrun simctl list runtimes --json \
            | python3 -c "import json,sys; rts=[r for r in json.load(sys.stdin)['runtimes'] if r['isAvailable'] and r['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS')]; print(sorted(rts, key=lambda r: r['version'])[-1]['identifier'])")
          echo "Using $runtime"
          xcrun simctl create "Readout CI iPhone" "iPhone 17 Pro" "$runtime"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -project Readout.xcodeproj \
            -scheme Readout \
            -destination 'platform=iOS Simulator,name=Readout CI iPhone' \
            -resultBundlePath TestResults.xcresult \
            test

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
